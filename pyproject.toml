[project]
name = "mj-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "liucao", email = "l-cao20@mails.tsinghua.edu.cn" }
]
requires-python = ">=3.13"
dependencies = [
    "mjlab",
    "omegaconf>=2.3",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
mjlab = { path = "../mjlab", editable = true }

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
